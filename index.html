<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sortly — Alphabetical Sorter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>U.S Saini Medical Store<span class="accent">.</span></h1>
      <p>Your list, organized automatically.</p>
    </header>

    <section class="card">
      <form class="controls" id="addForm">
        <input id="wordInput" type="text"
          placeholder="Enter a name or word..." autocomplete="off">
        <button class="add-btn" type="submit">+ Add Item</button>
      </form>

      <div class="table-heading">
        <h2>Your Items</h2>
        <span class="count" id="count">0 items</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="number">#</th>
              <th>Name (A–Z)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="footer">
        <span id="saveStatus">Auto-save enabled</span>
        <button class="clear-btn" id="clearBtn" type="button">Clear All</button>
      </div>
    </section>
    <footer class="signature">Made by Saxena_sahab76</footer>
    <!-- <footer class="signature">Community Srahul522.</footer> -->
  </main>
</body>
</html>
